<!DOCTYPE HTML>
<html lang="zh">
    <head>
        <meta charset = "UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
        
        <title>英文测试</title>
        <link rel = "stylesheet" href = "style.css">
    </head>
    <body>
        <h1 style = "text-align: center;" class = "Chinese_h1">欢迎!</h1>
        <h3 style = "text-align: center;" class = "Chinese_h3">
            这个测验是用来让我知道你们英文的水品，也能让我知道自己应该叫些什么!
        </h3>
        <h3 style = "text-align: center;" class = "Chinese_h3">
            不用单行！这应该是个轻松的测验，只用来帮助我和你.
        </h3>
        <h3 style = "text-align: center;">
            注意! 点击 “下一步” 的时候，你不能回到上个问题!
        </h3>
        <button id = "my_Btn" type = "button" class = "animation" onclick = "audio.play()">
            开始!
        </button>
        <br>
        <br>
        <img src = "Tiger_wave.gif" alt = "Gif of a tiger waving!" id = "tiger_wave">
        <script>
            score = 0;
            const audio = new Audio();
            audio.src = "click.mp3";
            const my_Btn = document.getElementById("my_Btn");
            question_list = [
                "Q1",
                "Q2",
                "Q3"
            ]
            answer_choices = [
                "aww I love my cat :)",
                "b",
                "c",
                "d",

                "1",
                "2",
                "3",
                "4",

                "e",
                "f",
                "g",
                "h"
            ]
            correct_answers = [
                1,
                2,
                3
            ]
            
            which_questions_wrng = []
            question_number = 0
            choice_number = -1
            maximum_questions = 3
            my_Btn.addEventListener("click",function(e){
                document.body.innerHTML = `
                    <section id = "replace">
                        <h2 style = "text-align: center;">` 
                        + (question_number + 1) +
                        `</h2>
                        <h1 style = "text-align: center;">`
                        + question_list.at(question_number) + 
                        `</h1>
                        <div class = "checkbox_align">
                            <input type = "radio" onclick = "audio.play()" name = "answers" id = "1"><label>`
                            + answer_choices.at(choice_number+1) + 
                            `</label>
                        </div>
                        <br>

                        <div class = "checkbox_align">
                            <input type = "radio" onclick = "audio.play()" name = "answers" id = "2"><label>`
                            + answer_choices.at(choice_number+2)+
                            `</label>
                        </div>
                        <br>

                        <div class = "checkbox_align">
                            <input type = "radio" onclick = "audio.play()" name = "answers" id = "3"><label>`
                            + answer_choices.at(choice_number+3) + 
                            `</label>
                        </div>

                        <br>

                        <div class = "checkbox_align">
                            <input type = "radio" onclick = "audio.play()" name = "answers" id = "4"><label>`
                            + answer_choices.at(choice_number+4) + 
                            `</label>
                        </div>
                    </section>
                    
                    <br>

                    <button id = "next_btn" type = "button" class = "animation" onclick = "audio.play()">下一步</button>
                `
                
                
                function hi() {
                    const next_btn = document.getElementById("next_btn");
                    const one = document.getElementById(1);
                    const two = document.getElementById(2);
                    const three = document.getElementById(3);
                    const four = document.getElementById(4);
                    const one_imposter = document.getElementById(correct_answers.at(question_number));
                    if (document.getElementById(correct_answers.at(question_number)).checked) {
                        score = score + 1;
                    } else {
                        which_questions_wrng.push(question_number+1);
                    }
                    if (question_number < maximum_questions-1) {
                    choice_number = choice_number + 4
                    question_number = question_number + 1
                    console.log(question_number)
                    document.getElementById("replace").innerHTML = `
                     <section id = "replace">
                        <h2 style = "text-align: center;">` 
                        + (question_number + 1) +
                        `</h2>
                        <h1 style = "text-align: center;">`
                        + question_list.at(question_number) + 
                        `</h1>
                        
                        <div class = "checkbox_align">
                            <input type = "radio" onclick = "audio.play()" name = "answers" id = "1"><label>`
                            + answer_choices.at(choice_number+1) + 
                            `</label>
                        </div>

                        <br>

                        <div class = "checkbox_align">
                            <input type = "radio" onclick = "audio.play()" name = "answers" id = "2"><label>`
                            + answer_choices.at(choice_number+2)+
                            `</label>
                        </div>

                        <br>

                        <div class = "checkbox_align">
                            <input type = "radio" onclick = "audio.play()" name = "answers" id = "3"><label>`
                            + answer_choices.at(choice_number+3) + 
                            `</label>
                        </div>

                        <br>

                        <div class = "checkbox_align">
                            <input type = "radio" onclick = "audio.play()" name = "answers" id = "4"><label>`
                            + answer_choices.at(choice_number+4) + 
                            `</label>
                        </div>
                    </section>
                    `
                    } else {
                        document.body.innerHTML = `
                            <h1 style = "text-align: center;">Done! :)</h1>
                            <h1 style = "text-align: center;">Score:` + score + `</h1>
                            <h1 style = "text-align: center;">Wrong questions:` + which_questions_wrng + `</h1>
                            `
                    }
                }
                next_btn.addEventListener("click",hi)
                
            })
            
        </script>
    </body>
</html>
